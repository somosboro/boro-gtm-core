[project]
name = "boro-gtm-core"
version = "0.2.1"
description = "Evidence-driven market intelligence and commercial experimentation infrastructure"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["market-intelligence", "gtm", "b2b", "scoring", "evidence", "data-provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "jsonschema>=4.23",
    "typer>=0.15",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://somosboro.com"
Repository = "https://github.com/somosboro/boro-gtm-core"

[project.scripts]
gtm = "boro_gtm.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["boro_gtm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query() in argument defaults is the framework idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Alembic writes these; leave the generated formatting alone.
"migrations/versions/*" = ["E501"]
