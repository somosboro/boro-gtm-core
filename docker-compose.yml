services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gtm
      POSTGRES_PASSWORD: gtm
      POSTGRES_DB: gtm_core
    ports:
      - "5432:5432"
    volumes:
      - gtm_pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtm -d gtm_core"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      GTM_DATABASE_URL: postgresql+psycopg://gtm:gtm@db:5432/gtm_core
      GTM_TEST_DATABASE_URL: postgresql+psycopg://gtm:gtm@db:5432/gtm_core_test
      GTM_LOG_JSON: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn boro_gtm.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  gtm_pgdata:
